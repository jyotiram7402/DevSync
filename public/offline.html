<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0F13" media="(prefers-color-scheme: dark)" />
    <title>You're offline · CopyAnywhere</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafb;
        --fg: #16171d;
        --muted: #5c6070;
        --tile: #5b5fff;
        --btn: #4a4ee6;
        --btn-fg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f13;
          --fg: #ecedf2;
          --muted: #a3a7b5;
          --btn: #7b7fff;
          --btn-fg: #0e0f13;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      .wrap {
        max-width: 22rem;
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 20px;
        border-radius: 12px;
        background: var(--tile);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        font-size: 0.9375rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        background: var(--btn);
        color: var(--btn-fg);
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 0.9375rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--btn);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="mark" aria-hidden="true">
        <svg viewBox="1.5 0 32 32" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 9 L17 16 L10 23" />
          <path d="M18 9 L25 16 L18 23" opacity="0.55" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        CopyAnywhere needs a connection to sync. Everything you saved is safe in your account and shows up as soon as
        you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
