<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · DevSync</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .wrap {
        max-width: 22rem;
      }
      .dot {
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        border-radius: 9999px;
        background: rgba(99, 102, 241, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      h1 {
        font-size: 1.05rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        color: #a1a1aa;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        background: #6366f1;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 0.875rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="dot">⚡</div>
      <h1>You're offline</h1>
      <p>
        DevSync needs a connection to sync. Anything you saved is safe — it will appear as soon as
        you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
